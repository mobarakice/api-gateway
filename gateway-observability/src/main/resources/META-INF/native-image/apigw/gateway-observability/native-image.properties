# Netty and SLF4J initialise some classes at image build time and cache loggers in static fields.
# These logger types hold only a name and read levels/sinks from runtime-initialised holders,
# so they are safe to store in the image heap (reviewed; see docs/adr/0007).
Args = --initialize-at-build-time=apigw.observability.logging.JsonLogProvider,apigw.observability.logging.JsonLoggerFactory,apigw.observability.logging.JsonLogger
