# Creates users/roles and enables auth once the cluster has quorum. Idempotent (a no-op once auth is on), so it is
# safe to re-apply; re-run after a restore only if the restored data predates auth.
apiVersion: batch/v1
kind: Job
metadata:
  name: etcd-bootstrap-auth
  labels: {app.kubernetes.io/name: etcd-ops}
spec:
  backoffLimit: 20
  template:
    metadata:
      labels: {app.kubernetes.io/name: etcd-ops}
    spec:
      serviceAccountName: etcd-ops
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: etcd-ops
          image: apigw/etcd-tools:0.9.0
          imagePullPolicy: IfNotPresent
          args: [bootstrap-auth]
          envFrom:
            - configMapRef: {name: etcd-ops-env}
            - secretRef: {name: etcd-backup-s3, optional: true}
          env:
            - {name: ETCD_CA_FILE, value: /etc/etcd/ca/ca.crt}
            - {name: ETCD_ROOT_PASSWORD_FILE, value: /etc/etcd/root/password}
            - {name: ETCD_GATEWAY_PASSWORD_FILE, value: /etc/etcd/gateway/password}
            - {name: ETCD_CONTROL_PLANE_PASSWORD_FILE, value: /etc/etcd/control-plane/password}
            - {name: BACKUP_DIR, value: /backup}
            - {name: HOME, value: /tmp}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: backup, mountPath: /backup}
            - {name: tmp, mountPath: /tmp}
            - {name: ca, mountPath: /etc/etcd/ca, readOnly: true}
            - {name: root, mountPath: /etc/etcd/root, readOnly: true}
            - {name: gateway, mountPath: /etc/etcd/gateway, readOnly: true}
            - {name: control-plane, mountPath: /etc/etcd/control-plane, readOnly: true}
      volumes:
        - name: backup
          emptyDir: {sizeLimit: 4Gi}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: ca
          secret: {secretName: etcd-ca, items: [{key: ca.crt, path: ca.crt}]}
        - name: root
          secret: {secretName: etcd-root, items: [{key: password, path: password}]}
        - name: gateway
          secret: {secretName: etcd-gateway, items: [{key: password, path: password}]}
        - name: control-plane
          secret: {secretName: etcd-control-plane, items: [{key: password, path: password}]}
