# Headless: stable peer/client DNS (etcd-N.etcd). Published before readiness so members can find each other while
# forming quorum.
apiVersion: v1
kind: Service
metadata:
  name: etcd
  labels: {app.kubernetes.io/name: etcd}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/name: etcd}
  ports:
    - {name: client, port: 2379, targetPort: client}
    - {name: peer, port: 2380, targetPort: peer}
    - {name: metrics, port: 2381, targetPort: metrics}
