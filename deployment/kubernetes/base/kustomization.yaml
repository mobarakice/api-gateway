# apigw base: gateway, control plane, admin console, dedicated etcd (+ backup/defrag), network policies.
# Secrets are referenced, never committed: docs/operations/kubernetes.md#secrets lists each one.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs: {app.kubernetes.io/part-of: apigw}
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - networkpolicy-default-deny.yaml
  - etcd
  - gateway
  - control-plane
  - console
images:
  - {name: apigw/gateway, newTag: 0.9.0}
  - {name: apigw/control-plane, newTag: 0.9.0}
  - {name: apigw/admin-console, newTag: 0.9.0}
  - {name: apigw/etcd-tools, newTag: 0.9.0}
