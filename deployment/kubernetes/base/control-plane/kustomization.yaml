apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [serviceaccount.yaml, deployment.yaml, service.yaml, pdb.yaml, networkpolicy.yaml]
# Overlays merge environment values (prefix, OIDC issuer/audience/keys, console origins).
configMapGenerator:
  - name: control-plane-env
    literals:
      - CP_HTTP_PORT=9443
      - CP_METRICS_PORT=9902
      - CP_ETCD_ENDPOINTS=https://etcd-0.etcd:2379,https://etcd-1.etcd:2379,https://etcd-2.etcd:2379
      - CP_ETCD_PREFIX=/gw/base/
      - CP_ETCD_MAX_TXN_OPS=128
      - CP_OIDC_AUDIENCE=admin-api
      - CP_OIDC_ALGORITHMS=RS256,ES256
      - GW_LOG_LEVEL=INFO
