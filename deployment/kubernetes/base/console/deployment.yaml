apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  labels: {app.kubernetes.io/name: console, app.kubernetes.io/component: admin-console}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/name: console}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: console, app.kubernetes.io/component: admin-console}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: console
          image: apigw/admin-console:0.9.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: SERVER_CONFIG_FILE, value: /etc/sws/sws.toml}
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/sws/sws.toml, subPath: sws.toml, readOnly: true}
            - {name: config, mountPath: /public/config.json, subPath: config.json, readOnly: true}
      volumes:
        - name: config
          configMap: {name: console-config}
