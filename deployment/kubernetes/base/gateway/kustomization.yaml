apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [serviceaccount.yaml, deployment.yaml, service.yaml, pdb.yaml, hpa.yaml, networkpolicy.yaml]
configMapGenerator:
  - name: gateway-env
    literals:
      - GW_HTTP_PORT=8080
      - GW_STATUS_PORT=9901
      - GW_SHUTDOWN_GRACE_SECONDS=25
      - GW_ETCD_ENDPOINTS=https://etcd-0.etcd:2379,https://etcd-1.etcd:2379,https://etcd-2.etcd:2379
      - GW_ETCD_PREFIX=/gw/base/
      - GW_ACCESS_LOG=all
      - GW_LOG_LEVEL=INFO
