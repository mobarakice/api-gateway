# GENERATED by generate-prometheusrule.sh from deployment/observability/prometheus/rules/apigw-alerts.yml.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: apigw
spec:
  groups:
    - name: apigw-gateway-traffic
      rules:
        - record: apigw:requests:rate5m
          expr: sum by (job) (rate(gw_requests_total[5m]))
        - record: apigw:errors5xx:ratio5m
          expr: |
            sum by (job) (rate(gw_requests_total{code=~"5.."}[5m]))
              / clamp_min(sum by (job) (rate(gw_requests_total[5m])), 1e-9)
        - record: apigw:request_duration:p99_5m
          expr: histogram_quantile(0.99, sum by (job, le) (rate(gw_request_duration_seconds_bucket[5m])))
  
        - alert: GatewayHighErrorRate
          expr: apigw:errors5xx:ratio5m > 0.05 and apigw:requests:rate5m > 1
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "More than 5% of gateway responses are 5xx"
            description: "{{ $value | humanizePercentage }} of requests failed with 5xx over the last 5 minutes."
            runbook: docs/operations/observability.md#gatewayhigherrorrate
  
        - alert: GatewayRouteHighErrorRate
          expr: |
            (sum by (job, route) (rate(gw_requests_total{code=~"5.."}[5m]))
              / clamp_min(sum by (job, route) (rate(gw_requests_total[5m])), 1e-9)) > 0.10
            and sum by (job, route) (rate(gw_requests_total[5m])) > 0.5
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Route {{ $labels.route }} returns more than 10% 5xx"
            description: "{{ $value | humanizePercentage }} 5xx on route {{ $labels.route }}."
            runbook: docs/operations/observability.md#gatewayroutehigherrorrate
  
        - alert: GatewayHighLatencyP99
          expr: apigw:request_duration:p99_5m > 1 and apigw:requests:rate5m > 1
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Gateway p99 latency above 1 s"
            description: "p99 request duration is {{ $value | humanizeDuration }} (includes upstream time)."
            runbook: docs/operations/observability.md#gatewayhighlatencyp99
  
        - alert: GatewayUpstreamPoolSaturated
          expr: sum by (job, upstream) (rate(gw_upstream_attempts_total{outcome="pool_full"}[5m])) > 0.1
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "Connection pool to upstream {{ $labels.upstream }} is full"
            description: "Requests fail fast with 503 because the pool wait queue is full; raise pool.maxConnections or scale the upstream."
            runbook: docs/operations/observability.md#gatewayupstreampoolsaturated
  
        - alert: GatewayCircuitBreakerOpen
          expr: max by (job, instance, upstream) (gw_upstream_breakers_open) > 0
          for: 1m
          labels: {severity: warning}
          annotations:
            summary: "Circuit breaker open for upstream {{ $labels.upstream }}"
            description: "{{ $value }} event loop(s) on {{ $labels.instance }} reject requests to {{ $labels.upstream }} with 503."
            runbook: docs/operations/observability.md#gatewaycircuitbreakeropen
  
    - name: apigw-gateway-saturation
      rules:
        - alert: GatewayCpuSaturated
          expr: rate(process_cpu_seconds_total{job="apigw-gateway"}[5m]) / process_cpu_count{job="apigw-gateway"} > 0.85
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Gateway {{ $labels.instance }} uses more than 85% of its CPUs"
            description: "Scale out before latency degrades."
            runbook: docs/operations/observability.md#gatewaycpusaturated
  
        - alert: GatewayHeapNearlyFull
          expr: |
            jvm_memory_used_bytes{job="apigw-gateway",area="heap"}
              / (jvm_memory_max_bytes{job="apigw-gateway",area="heap"} > 0) > 0.90
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Gateway {{ $labels.instance }} heap above 90%"
            description: "Check cache size (GW_CACHE_MAX_BYTES), rate-limit keys and route count against the memory limit."
            runbook: docs/operations/observability.md#gatewayheapnearlyfull
  
        - alert: GatewayLogLinesDropped
          expr: increase(gw_log_dropped_total[10m]) > 0
          for: 0m
          labels: {severity: info}
          annotations:
            summary: "Gateway {{ $labels.instance }} dropped log lines"
            description: "The log queue was full; consider GW_ACCESS_LOG=errors or faster log shipping."
            runbook: docs/operations/observability.md#gatewayloglinesdropped
  
        - alert: GatewayTraceExportFailing
          expr: increase(gw_tracing_spans_total{result=~"failed|dropped"}[10m]) > 100
          for: 10m
          labels: {severity: info}
          annotations:
            summary: "Gateway {{ $labels.instance }} is losing spans"
            description: "Spans were dropped or failed to export to the OTLP endpoint."
            runbook: docs/operations/observability.md#gatewaytraceexportfailing
  
    - name: apigw-gateway-availability
      rules:
        - alert: GatewayDown
          expr: up{job="apigw-gateway"} == 0
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: "Gateway {{ $labels.instance }} is not scrapeable"
            description: "The status port has not answered for 2 minutes."
            runbook: docs/operations/observability.md#gatewaydown
  
        - alert: GatewayNotReady
          expr: gw_ready == 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "Gateway {{ $labels.instance }} has not been ready for 5 minutes"
            description: "No valid snapshot, or draining. See /readyz and /configz on the status port."
            runbook: docs/operations/observability.md#gatewaynotready
  
    - name: apigw-config
      rules:
        - alert: GatewayConfigStale
          expr: |
            (time() - gw_config_etcd_last_success_timestamp_seconds > 120
              and gw_config_etcd_last_success_timestamp_seconds > 0)
            or gw_config_state{state="SERVING_STALE"} == 1
          for: 2m
          labels: {severity: warning}
          annotations:
            summary: "Gateway {{ $labels.instance }} has not reached etcd for over 2 minutes"
            description: "It keeps serving its current (or last-known-good) snapshot but will not see config changes."
            runbook: docs/operations/observability.md#gatewayconfigstale
  
        - alert: GatewayConfigRejected
          expr: gw_config_state{state="INVALID_CONFIG"} == 1 or increase(gw_config_rejected_total[10m]) > 0
          for: 1m
          labels: {severity: warning}
          annotations:
            summary: "Gateway {{ $labels.instance }} rejected the newest config revision"
            description: "The previous snapshot keeps serving. /configz names the failing keys."
            runbook: docs/operations/observability.md#gatewayconfigrejected
  
        - alert: GatewayBehindOnRevision
          # Newest publish any gateway of the job has seen, minus what this gateway serves.
          expr: |
            (max by (job) (gw_config_published_revision) - on (job) group_right () gw_config_applied_revision) > 0
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "Gateway {{ $labels.instance }} serves an older config than was published"
            description: "Its applied revision has been behind the newest publish for 5 minutes."
            runbook: docs/operations/observability.md#gatewaybehindonrevision
  
        - alert: ConfigPropagationSlow
          expr: |
            histogram_quantile(0.99, sum by (job, le) (rate(gw_config_propagation_seconds_bucket[30m]))) > 5
          for: 15m
          labels: {severity: info}
          annotations:
            summary: "p99 publish-to-serve time above 5 s"
            description: "Changes take {{ $value | humanizeDuration }} to reach gateways (target: 2 s)."
            runbook: docs/operations/observability.md#configpropagationslow
  
    - name: apigw-control-plane
      rules:
        - alert: ControlPlaneDown
          expr: up{job="apigw-control-plane"} == 0
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "Control plane {{ $labels.instance }} is not scrapeable"
            description: "Config changes cannot be made; gateways keep serving."
            runbook: docs/operations/observability.md#controlplanedown
  
        - alert: ControlPlaneErrors
          expr: sum by (job) (rate(cp_http_requests_total{code="5xx"}[10m])) > 0.05
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Admin API returns 5xx"
            description: "Check etcd health and control-plane logs (request IDs in the problem bodies)."
            runbook: docs/operations/observability.md#controlplaneerrors
  
    - name: apigw-etcd
      rules:
        - alert: EtcdDown
          expr: up{job="etcd"} == 0
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: "etcd member {{ $labels.instance }} is down"
            description: "Gateways keep serving; with quorum lost, no config change can be published."
            runbook: docs/operations/observability.md#etcddown
  
        - alert: EtcdNoLeader
          expr: etcd_server_has_leader == 0
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: "etcd member {{ $labels.instance }} has no leader"
            description: "The cluster has lost quorum or is partitioned."
            runbook: docs/operations/observability.md#etcdnoleader
  
        - alert: EtcdFrequentLeaderChanges
          expr: increase(etcd_server_leader_changes_seen_total[15m]) > 3
          for: 0m
          labels: {severity: warning}
          annotations:
            summary: "etcd leader changed {{ $value }} times in 15 minutes"
            description: "Usually disk or network latency on the members."
            runbook: docs/operations/observability.md#etcdfrequentleaderchanges
  
        - alert: EtcdDatabaseNearQuota
          expr: etcd_mvcc_db_total_size_in_bytes / etcd_server_quota_backend_bytes > 0.80
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "etcd database on {{ $labels.instance }} is {{ $value | humanizePercentage }} of its quota"
            description: "Compact and defragment; at 100% etcd becomes read-only (alarm NOSPACE)."
            runbook: docs/operations/observability.md#etcddatabasenearquota
