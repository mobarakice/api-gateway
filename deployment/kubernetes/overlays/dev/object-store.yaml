# dev only: S3-compatible object store (rclone serve s3) standing in for the real backup bucket.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: object-store
  labels: {app.kubernetes.io/name: object-store}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: object-store}
  template:
    metadata:
      labels: {app.kubernetes.io/name: object-store}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: s3
          image: apigw/etcd-tools:0.9.0
          imagePullPolicy: IfNotPresent
          args: [serve-s3]
          env:
            - {name: S3_ACCESS_KEY_FILE, value: /etc/s3/access-key}
            - {name: S3_SECRET_KEY_FILE, value: /etc/s3/secret-key}
            - {name: S3_ROOT, value: /data}
            - {name: HOME, value: /tmp}
          ports:
            - {name: s3, containerPort: 9000}
          readinessProbe:
            tcpSocket: {port: s3}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - {name: keys, mountPath: /etc/s3, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: object-store}
        - name: tmp
          emptyDir: {}
        - name: keys
          secret: {secretName: object-store-keys}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: object-store
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: object-store
spec:
  selector: {app.kubernetes.io/name: object-store}
  ports:
    - {name: s3, port: 9000, targetPort: s3}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: object-store
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: object-store}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: etcd-ops}
      ports:
        - {protocol: TCP, port: 9000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: etcd-ops-object-store
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: etcd-ops}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: object-store}
      ports:
        - {protocol: TCP, port: 9000}
