# dev only: upstream for rehearsals (rollout drain test). Not part of staging/prod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  labels: {app.kubernetes.io/name: echo}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: echo}
  template:
    metadata:
      labels: {app.kubernetes.io/name: echo}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: echo
          image: ealen/echo-server:0.9.2
          env:
            - {name: PORT, value: "8080"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /, port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: echo
spec:
  selector: {app.kubernetes.io/name: echo}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: echo
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: echo}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: gateway}
      ports:
        - {protocol: TCP, port: 8080}
