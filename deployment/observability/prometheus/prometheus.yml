# Scrape configuration for the local Compose stack (deployment/docker/compose.yml). Kubernetes scraping
# is described in docs/operations/observability.md. Metrics listeners are internal: never expose them.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/apigw-alerts.yml

scrape_configs:
  - job_name: apigw-gateway          # GW_STATUS_PORT /metrics
    static_configs:
      - targets: ["gateway-1:9901", "gateway-2:9901"]
  - job_name: apigw-control-plane    # CP_METRICS_PORT /metrics
    static_configs:
      - targets: ["control-plane:9902"]
  - job_name: etcd                   # --listen-metrics-urls (plain HTTP, metrics only)
    static_configs:
      - targets: ["etcd:2381"]
