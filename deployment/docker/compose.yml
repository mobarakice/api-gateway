# Local stack (dev only): etcd (TLS + auth), Redis (ACL), echo upstream, 2 gateways, control plane,
# Keycloak (OIDC for the console), admin console, Prometheus + Grafana + Jaeger (observability). All secrets and certificates are generated into
# ./.local by the init service; nothing is hard-coded. Host ports bind to 127.0.0.1 only.
#
#   docker compose -f deployment/docker/compose.yml up -d --build   (native images; first build ~5 min each)
#   JVM images instead (jvm-prod, for comparisons): ./gradlew :gateway-app:installDist :control-plane:installDist and
#   COMPOSE_FILE=deployment/docker/compose.yml:deployment/docker/compose.jvm.yml
#   console: http://localhost:8280   gateway: http://localhost:8080   Admin API: https://localhost:9443
#   Grafana: http://localhost:3000 (admin / .local/secrets/grafana-admin)   Prometheus: http://localhost:9090
#   Jaeger: http://localhost:16686
name: apigw

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  user: "10001:10001"
  tmpfs: [/tmp]
  restart: unless-stopped

networks:
  gw:
    ipam:
      config:
        - subnet: 10.250.0.0/24

volumes:
  etcd-data:
  cp-data:
  gw1-lkg:
  gw2-lkg:

services:
  init:
    build: { context: ./init }
    image: apigw/dev-init:local
    command: ["certs"]
    volumes:
      - ./.local:/work
      - ./keycloak/realm.template.json:/realm.template.json:ro
      - etcd-data:/data/etcd
      - cp-data:/data/control-plane
      - gw1-lkg:/data/gw1
      - gw2-lkg:/data/gw2
    networks: [gw]

  etcd:
    <<: *hardened
    image: gcr.io/etcd-development/etcd:v3.7.3
    depends_on: { init: { condition: service_completed_successfully } }
    command:
      - etcd
      - --name=etcd
      - --data-dir=/var/lib/etcd/data
      - --listen-client-urls=https://0.0.0.0:2379
      - --advertise-client-urls=https://etcd:2379
      - --cert-file=/certs/server.pem
      - --key-file=/certs/server-key.pem
      - --auth-token=simple
      - --max-txn-ops=128
      - --quota-backend-bytes=2147483648
      - --listen-metrics-urls=http://0.0.0.0:2381
    volumes:
      - ./.local/certs:/certs:ro
      - etcd-data:/var/lib/etcd
    networks: [gw]

  etcd-auth:
    image: apigw/dev-init:local
    depends_on: { etcd: { condition: service_started } }
    command: ["etcd-auth"]
    environment: { GW_PREFIX: /gw/dev/ }
    volumes: [./.local:/work]
    networks: [gw]

  redis:
    <<: *hardened
    image: redis:8.10.3
    depends_on: { init: { condition: service_completed_successfully } }
    entrypoint: ["sh", "-c"]
    command:
      - >-
        exec redis-server --save '' --appendonly no --user default off
        --user gateway on ">$$(cat /secrets/redis-gateway)" '~gw*'
        +ping +auth +select +get +set +eval +evalsha +hmget +hset +pexpire +incrby +time
    volumes: [./.local/secrets:/secrets:ro]
    networks: [gw]

  echo:
    <<: *hardened
    image: ealen/echo-server:0.9.2
    environment: { PORT: "8080" }
    networks: [gw]

  gateway-1: &gateway
    <<: *hardened
    build: { context: ../.., dockerfile: deployment/docker/gateway.native.Dockerfile }
    image: apigw/gateway:0.9.0
    depends_on:
      etcd-auth: { condition: service_completed_successfully }
      redis: { condition: service_started }
    environment: &gwenv
      GW_GATEWAY_ID: gateway-1
      GW_HTTP_PORT: "8080"
      GW_STATUS_PORT: "9901"
      GW_ETCD_ENDPOINTS: https://etcd:2379
      GW_ETCD_CA: /certs/ca.pem
      GW_ETCD_USER: gateway
      GW_ETCD_PASSWORD_FILE: /secrets/etcd-gateway
      GW_ETCD_PREFIX: /gw/dev/
      GW_LKG_DIR: /var/lib/gateway/lkg
      GW_REDIS_URL: redis://redis:6379
      GW_REDIS_USER: gateway
      GW_REDIS_PASSWORD_FILE: /secrets/redis-gateway
      GW_SHUTDOWN_GRACE_SECONDS: "5"
      GW_TRACING_ENDPOINT: http://jaeger:4318
      GW_TRACING_SAMPLE_RATIO: "0.1"
    volumes:
      - ./.local/certs/ca.pem:/certs/ca.pem:ro
      - ./.local/secrets:/secrets:ro
      - gw1-lkg:/var/lib/gateway/lkg
    ports: ["127.0.0.1:8080:8080"]
    networks: [gw]

  gateway-2:
    <<: *gateway
    environment:
      <<: *gwenv
      GW_GATEWAY_ID: gateway-2
    volumes:
      - ./.local/certs/ca.pem:/certs/ca.pem:ro
      - ./.local/secrets:/secrets:ro
      - gw2-lkg:/var/lib/gateway/lkg
    ports: ["127.0.0.1:8081:8080"]

  control-plane:
    <<: *hardened
    build: { context: ../.., dockerfile: deployment/docker/control-plane.native.Dockerfile }
    image: apigw/control-plane:0.9.0
    depends_on: { etcd-auth: { condition: service_completed_successfully } }
    environment:
      CP_HTTP_PORT: "9443"
      CP_TLS_CERT: /certs/server.pem
      CP_TLS_KEY: /certs/server-key.pem
      CP_ETCD_ENDPOINTS: https://etcd:2379
      CP_ETCD_CA: /certs/ca.pem
      CP_ETCD_USER: control-plane
      CP_ETCD_PASSWORD_FILE: /secrets/etcd-control-plane
      CP_ETCD_PREFIX: /gw/dev/
      CP_OIDC_ISSUER: https://localhost:8543/realms/gateway
      CP_OIDC_AUDIENCE: admin-api
      CP_OIDC_JWKS_URI: https://keycloak:8443/realms/gateway/protocol/openid-connect/certs
      CP_OIDC_CA: /certs/ca.pem
      CP_CORS_ORIGINS: http://localhost:8280,http://localhost:5173
      CP_AUDIT_FILE: /var/lib/control-plane/audit.jsonl
      CP_METRICS_PORT: "9902"
    volumes:
      - ./.local/certs:/certs:ro
      - ./.local/secrets:/secrets:ro
      - cp-data:/var/lib/control-plane
    ports: ["127.0.0.1:9443:9443"]
    networks: [gw]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.5
    depends_on: { init: { condition: service_completed_successfully } }
    user: "10001:0"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
      - --http-enabled=false
      - --https-port=8443
      - --https-certificate-file=/certs/server.pem
      - --https-certificate-key-file=/certs/server-key.pem
      - --hostname=https://localhost:8543
      - --hostname-backchannel-dynamic=true
      - --health-enabled=true
    volumes:
      - ./.local/certs:/certs:ro
      - ./.local/keycloak:/opt/keycloak/data/import:ro
    ports: ["127.0.0.1:8543:8443"]
    networks: [gw]

  console:
    <<: *hardened
    build: { context: ../../admin-console }
    image: apigw/admin-console:0.9.0
    environment: { SERVER_CONFIG_FILE: /etc/sws/sws.toml }
    volumes:
      - ./console/sws.toml:/etc/sws/sws.toml:ro
      - ./console/config.json:/public/config.json:ro
    ports: ["127.0.0.1:8280:8080"]
    networks: [gw]

  # Observability (dev): state lives in tmpfs and is rebuilt from provisioning on restart.
  prometheus:
    <<: *hardened
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    tmpfs: [/tmp, "/prometheus:uid=10001,gid=10001,mode=0700"]
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
    ports: ["127.0.0.1:9090:9090"]
    networks: [gw]

  jaeger:
    <<: *hardened
    image: jaegertracing/jaeger:2.23.0
    ports: ["127.0.0.1:16686:16686"]
    networks: [gw]

  grafana:
    <<: *hardened
    image: grafana/grafana:13.3.0
    depends_on: { init: { condition: service_completed_successfully } }
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /secrets/grafana-admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PATHS_DATA: /var/lib/grafana
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    tmpfs: [/tmp, "/var/lib/grafana:uid=10001,gid=10001,mode=0700"]
    volumes:
      - ./.local/secrets/grafana-admin:/secrets/grafana-admin:ro
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/etc/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    networks: [gw]
